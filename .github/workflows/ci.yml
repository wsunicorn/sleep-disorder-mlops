name: CI/CD — Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manual deploy"
        required: false
        default: "Manual CI/CD run"

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: sleep-portal
  ECS_CLUSTER: sleep-portal-cluster
  ECS_SERVICE: sleep-portal-service
  MODEL_ARTIFACT_S3_URI: s3://sleep-mlops-651709/models
  MLOPS_FEATURE_STORE_S3_URI: s3://sleep-mlops-651709/monitoring/current

jobs:
  # ─── Job 1: Unit Tests ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sleepuser
          POSTGRES_PASSWORD: sleeppass
          POSTGRES_DB: sleepdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: sleep_portal.settings.development
          DJANGO_SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://sleepuser:sleeppass@localhost:5432/sleepdb
          REDIS_URL: redis://localhost:6379/0
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          cd sleep_portal
          pytest ../tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml

  # ─── Job 2: Build & Push Docker Image ──────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download model artifacts from S3
        run: |
          mkdir -p models
          aws s3 cp "$MODEL_ARTIFACT_S3_URI/model.pkl" models/model.pkl || echo "model.pkl not in S3, skipping"
          aws s3 cp "$MODEL_ARTIFACT_S3_URI/model.ubj" models/model.ubj || echo "model.ubj not in S3, skipping"
          aws s3 cp "$MODEL_ARTIFACT_S3_URI/label_encoder.pkl" models/label_encoder.pkl || echo "label_encoder.pkl not in S3, using repo copy"
          aws s3 cp "$MODEL_ARTIFACT_S3_URI/feature_names.json" models/feature_names.json || echo "feature_names.json not in S3, using repo copy"
          aws s3 cp "$MODEL_ARTIFACT_S3_URI/metadata.json" models/metadata.json || echo "metadata.json not in S3, using repo copy"
          ls -lh models/

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─── Job 3: Deploy to ECS Fargate ──────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure public ALB
        run: bash scripts/ensure_aws_alb.sh

      - name: Register ECS task definition
        id: task-def
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].taskDefinition" \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query "taskDefinition" > current-task-definition.json

          jq \
            --arg IMAGE "${{ needs.build-and-push.outputs.image }}" \
            --arg MODEL_ARTIFACT_S3_URI "$MODEL_ARTIFACT_S3_URI" \
            --arg MLOPS_FEATURE_STORE_S3_URI "$MLOPS_FEATURE_STORE_S3_URI" \
            '
            def upsert_env($name; $value):
              .environment = ((.environment // []) | map(select(.name != $name)) + [{"name": $name, "value": $value}]);

            .containerDefinitions |= map(
              if .name == "sleep-portal" then
                .image = $IMAGE
                | upsert_env("MODEL_ARTIFACT_S3_URI"; $MODEL_ARTIFACT_S3_URI)
                | upsert_env("MLOPS_FEATURE_STORE_S3_URI"; $MLOPS_FEATURE_STORE_S3_URI)
              else
                .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
            ' current-task-definition.json > new-task-definition.json

          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "task_definition_arn=$NEW_TASK_DEF" >> "$GITHUB_OUTPUT"
          echo "Registered task definition: $NEW_TASK_DEF"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition "${{ steps.task-def.outputs.task_definition_arn }}" \
            --desired-count 1 \
            --load-balancers "targetGroupArn=$TG_ARN,containerName=sleep-portal,containerPort=8000" \
            --force-new-deployment \
            --query 'service.deployments[0].status' \
            --output text
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Run Django migrate
        env:
          MIGRATE_OVERRIDES: >-
            {"containerOverrides":[{"name":"sleep-portal","command":["python","manage.py","migrate","--noinput"]}]}
        run: |
          SUBNETS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].networkConfiguration.awsvpcConfiguration.subnets" \
            --output text | tr '\t' ',')
          SECURITY_GROUPS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].networkConfiguration.awsvpcConfiguration.securityGroups" \
            --output text | tr '\t' ',')
          ASSIGN_PUBLIC_IP=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp" \
            --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition sleep-portal-task \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
            --overrides "$MIGRATE_OVERRIDES" \
            --query "tasks[0].taskArn" --output text)
          echo "Migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text)
          echo "Migrate exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || exit 1

      - name: Smoke test deployed service
        run: |
          : "${APP_URL:?APP_URL was not set by ensure_aws_alb.sh}"
          echo "App URL: $APP_URL"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors --max-time 20 \
            "$APP_URL/api/v1/health/"
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$APP_URL/api/v1/model-info/"

      - name: Notify deploy complete
        run: echo "Deployed image ${{ needs.build-and-push.outputs.image }} to ECS"
