name: Monitoring - Drift Check

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitoring.yml"
      - "monitoring/**"
  workflow_dispatch:
    inputs:
      reference_data:
        description: "Reference parquet path (local or s3://...)"
        required: false
        default: ""
      current_data:
        description: "Current parquet path (local or s3://...)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"

env:
  AWS_REGION: ap-southeast-1
  MONITOR_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  MONITOR_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DRIFT_THRESHOLD: ${{ vars.DRIFT_THRESHOLD || '0.3' }}
  RETRAIN_TRAINING_DATA: ${{ vars.RETRAIN_TRAINING_DATA || 's3://sleep-mlops-651709/features/reference/features.parquet' }}
  MODEL_ARTIFACT_S3_URI: ${{ vars.MODEL_ARTIFACT_S3_URI || 's3://sleep-mlops-651709/models' }}

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve drift inputs
        id: drift-inputs
        shell: bash
        run: |
          REF="${{ inputs.reference_data || vars.DRIFT_REFERENCE_DATA || '' }}"
          CUR="${{ inputs.current_data || vars.DRIFT_CURRENT_DATA || '' }}"

          if [ -z "$REF" ] || [ -z "$CUR" ]; then
            echo "No drift data configured; skipping monitoring check."
            echo "Set workflow inputs or repository variables DRIFT_REFERENCE_DATA and DRIFT_CURRENT_DATA."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEEDS_AWS=false
          if [[ "$REF" == s3://* || "$CUR" == s3://* ]]; then
            NEEDS_AWS=true
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "needs_aws=$NEEDS_AWS" >> "$GITHUB_OUTPUT"
          echo "reference_data=$REF" >> "$GITHUB_OUTPUT"
          echo "current_data=$CUR" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: steps.drift-inputs.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitoring dependencies
        if: steps.drift-inputs.outputs.enabled == 'true'
        run: |
          pip install --upgrade pip
          pip install pandas pyarrow "evidently>=0.4.0,<0.5.0" boto3 python-dotenv loguru

      - name: Validate AWS credentials for S3 data
        if: >-
          steps.drift-inputs.outputs.needs_aws == 'true' &&
          (env.MONITOR_AWS_ACCESS_KEY_ID == '' || env.MONITOR_AWS_SECRET_ACCESS_KEY == '')
        run: |
          echo "::error::S3 drift data requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets."
          exit 1

      - name: Configure AWS credentials
        if: >-
          steps.drift-inputs.outputs.needs_aws == 'true' &&
          env.MONITOR_AWS_ACCESS_KEY_ID != '' &&
          env.MONITOR_AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.MONITOR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.MONITOR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run drift detection
        id: drift-run
        if: steps.drift-inputs.outputs.enabled == 'true'
        shell: bash
        run: |
          python monitoring/drift_detection.py \
            --reference-data "${{ steps.drift-inputs.outputs.reference_data }}" \
            --current-data "${{ steps.drift-inputs.outputs.current_data }}" \
            --output-report reports/ \
            --threshold "$DRIFT_THRESHOLD"

      - name: Read drift decision
        id: drift-result
        if: steps.drift-inputs.outputs.enabled == 'true'
        shell: bash
        run: |
          ALERT=$(python -c "import json; data=json.load(open('reports/drift_summary_latest.json', encoding='utf-8')); print(str(data.get('alert', False)).lower())")
          SHARE=$(python -c "import json; data=json.load(open('reports/drift_summary_latest.json', encoding='utf-8')); print(data.get('drift_share', 0.0))")
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"
          echo "drift_share=$SHARE" >> "$GITHUB_OUTPUT"
          echo "Drift alert: $ALERT (share=$SHARE)"

      - name: Trigger retrain workflow
        if: steps.drift-result.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run retrain.yml \
            --ref main \
            -f reason="Data drift detected by monitoring.yml (share=${{ steps.drift-result.outputs.drift_share }})" \
            -f training_data="$RETRAIN_TRAINING_DATA" \
            -f extra_data="${{ steps.drift-inputs.outputs.current_data }}" \
            -f extra_data_policy="verified_only" \
            -f artifact_s3_uri="$MODEL_ARTIFACT_S3_URI" \
            -f model_type="all" \
            -f deploy_after_success="true"

      - name: Upload drift reports
        if: always() && steps.drift-inputs.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: reports/
          if-no-files-found: ignore
