stages:
  preprocess:
    cmd: python feature_engineering/preprocess.py --input-dir data/raw --output-dir data/processed
    deps:
      - feature_engineering/preprocess.py
      - data/raw
    outs:
      - data/processed

  extract_features:
    cmd: python feature_engineering/extract_features.py --input-dir data/processed --output-dir data/features
    deps:
      - feature_engineering/cap_features.py
      - feature_engineering/extract_features.py
      - data/processed
    params:
      - features.sfreq
      - features.window_samples
    outs:
      - data/features/features.parquet

  train:
    cmd: python training/train.py --data-dir ${train.data_dir} --model-dir models --model-type ${train.model_type} --test-size ${train.test_size} --random-seed ${train.random_seed}
    deps:
      - training/train.py
      - feature_engineering/cap_features.py
      - data/raw/balanced_CAP
    params:
      - train.test_size
      - train.random_seed
      - train.model_type
      - train.max_per_class
    metrics:
      - metrics.json:
          cache: false
    outs:
      - models
